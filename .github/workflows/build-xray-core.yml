name: Build Beeline Xray core (android/arm64)

# Builds the Beeline-patched Xray core as libxray.so for arm64-v8a.
#
# Base tag is v26.6.0 (default): the newest Xray-core that does NOT pull
# pion/stun (added in v26.6.1 for realm STUN), which transitively pulls
# github.com/wlynxg/anet. anet's Android build corrupts the net package and
# kills UDP/DNS in the tunnel (TCP survives). The stock core shipped in the app
# is a v26.6.0-era build with no anet, and it works — so we match it.
#
# The only change vs upstream is a short 12-char Base64URL XHTTP session ID
# (Beeline CDN rejects the 36-char UUID with 403), applied by ci/patch-xray.sh.
#
# Download the artifact and drop it into
#   app/src/main/jniLibs/arm64-v8a/libxray.so
# Never replace it with an official Xray binary (Beeline profile -> 403).

on:
  workflow_dispatch:
    inputs:
      xray_tag:
        description: Xray-core tag to build
        default: v26.6.0
        required: true
  push:
    paths:
      - 'ci/**'
      - '.github/workflows/build-xray-core.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      XRAY_TAG: ${{ github.event.inputs.xray_tag || 'v26.6.0' }}
      ANDROID_API: '24'
    steps:
      - uses: actions/checkout@v4

      - name: Set up stock Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Fetch and patch Xray-core
        run: |
          set -eux
          git clone --depth 1 --branch "$XRAY_TAG" https://github.com/XTLS/Xray-core.git xray
          chmod +x ci/patch-xray.sh
          ci/patch-xray.sh "$PWD/xray" "$PWD/ci"

      - name: Verify short session-ID patch
        working-directory: xray
        run: go test ./transport/internet/... -run TestNewBeelineSessionID -count=1

      - name: Build android/arm64 libxray.so
        working-directory: xray
        run: |
          set -eux
          NDK='${{ steps.ndk.outputs.ndk-path }}'
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$CC" \
            go build -trimpath -buildmode=pie -ldflags="-s -w" -o libxray.so ./main
          file libxray.so
          test "$(file -b libxray.so | grep -c 'pie executable')" = 1
          # must match the working stock core: no anet / net.zoneCache poison
          test "$(strings libxray.so | grep -c 'net.zoneCache')" = 0
          test "$(strings libxray.so | grep -c 'wlynxg/anet')" = 0
          sha256sum libxray.so | tee libxray.so.sha256

      - name: Upload libxray.so
        uses: actions/upload-artifact@v4
        with:
          name: libxray-beeline-arm64-v8a
          path: |
            xray/libxray.so
            xray/libxray.so.sha256
          if-no-files-found: error
