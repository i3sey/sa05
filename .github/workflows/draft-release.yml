name: Draft Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, for example 1.0.1"
        required: true
        type: string
      version_code:
        description: "Android versionCode, must increase for each release"
        required: true
        type: number
      changelog:
        description: "Release changelog"
        required: false
        type: string
      allow_debug_signing:
        description: "Allow debug signing fallback. Do not use for real releases."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  draft-release:
    name: Build APK and draft release
    runs-on: ubuntu-latest

    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      TAG_NAME: v${{ inputs.version_name }}
      # Base Xray tag for the Beeline-patched core. Keep in sync with
      # .github/workflows/build-xray-core.yml (newest tag before pion/anet).
      XRAY_TAG: v26.5.9
      ANDROID_API: '24'
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ALLOW_DEBUG_SIGNING: ${{ inputs.allow_debug_signing }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate version inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z]+)?$ ]] || {
            echo "version_name must look like 1.0, 1.0.1, or 1.0.1-beta1" >&2
            exit 1
          }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "version_code must be a positive integer" >&2
            exit 1
          }

      - name: Configure signing key
        shell: bash
        run: |
          set -euo pipefail
          signing_values=(
            "$ANDROID_RELEASE_KEYSTORE_BASE64"
            "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
            "$ANDROID_RELEASE_KEY_ALIAS"
            "$ANDROID_RELEASE_KEY_PASSWORD"
          )
          present=0
          for value in "${signing_values[@]}"; do
            if [[ -n "$value" ]]; then
              present=$((present + 1))
            fi
          done
          if [[ "$present" -eq 0 ]]; then
            if [[ "$ALLOW_DEBUG_SIGNING" == "true" ]]; then
              echo "Release signing secrets are not configured; building with debug signing fallback."
              exit 0
            fi
            echo "Release signing secrets are not configured. Refusing to create a real release with debug signing." >&2
            echo "Set all signing secrets, or rerun with allow_debug_signing=true for a test APK." >&2
            exit 1
          fi
          if [[ "$present" -ne 4 ]]; then
            echo "Configure all signing secrets or leave all of them empty:" >&2
            echo "ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS, ANDROID_RELEASE_KEY_PASSWORD" >&2
            exit 1
          fi
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sa05-release.jks"
          {
            printf 'RELEASE_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/sa05-release.jks"
            printf 'RELEASE_KEYSTORE_PASSWORD=%s\n' "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$ANDROID_RELEASE_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$ANDROID_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Release signing configured."

      - name: Test
        run: ./gradlew testDebugUnitTest

      # The APK must ship the Beeline-patched core, never a stock Xray binary
      # (stock -> HTTP 403 on the Beeline XHTTP profile). Build it fresh here and
      # overwrite the committed jniLibs binary before assembling the release, so
      # a release can never accidentally bundle an unpatched or stale core.
      - name: Set up stock Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build Beeline-patched libxray.so (android/arm64)
        run: |
          set -eux
          git clone --depth 1 --branch "$XRAY_TAG" https://github.com/XTLS/Xray-core.git xray
          chmod +x ci/patch-xray.sh
          ci/patch-xray.sh "$PWD/xray" "$PWD/ci"
          ( cd xray && go test ./transport/internet/... -run TestNewBeelineSessionID -count=1 )
          NDK='${{ steps.ndk.outputs.ndk-path }}'
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          ( cd xray && GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$CC" \
              go build -trimpath -buildmode=pie -ldflags="-s -w" -o libxray.so ./main )
          # Guard against the anet/net.zoneCache regression that breaks UDP/DNS.
          test "$(strings xray/libxray.so | grep -c 'net.zoneCache')" = 0
          test "$(strings xray/libxray.so | grep -c 'wlynxg/anet')" = 0
          test "$(file -b xray/libxray.so | grep -c 'pie executable')" = 1
          install -m 0644 xray/libxray.so \
            app/src/main/jniLibs/arm64-v8a/libxray.so
          sha256sum app/src/main/jniLibs/arm64-v8a/libxray.so

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify 16 KB compatibility
        run: scripts/check-16kb-compat.sh app/build/outputs/apk/release/app-release.apk

      - name: Verify release signing
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/apk-signing.txt"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk | tee "$report"
          if grep -q "CN=Android Debug" "$report"; then
            echo "APK is signed with the Android debug certificate. Refusing to create a release." >&2
            exit 1
          fi

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/sa05-${VERSION_NAME}-release.apk"

      - name: Write changelog
        shell: bash
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          {
            printf 'versionName: %s\n' "$VERSION_NAME"
            printf 'versionCode: %s\n' "$VERSION_CODE"
            printf 'asset: sa05-%s-release.apk\n' "$VERSION_NAME"
            printf '\n'
            if [[ -n "${CHANGELOG:-}" ]]; then
              printf '%s\n' "$CHANGELOG"
            else
              printf '%s\n' "No changelog provided."
            fi
          } > release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" release/*.apk \
            --draft \
            --target "$GITHUB_SHA" \
            --title "SA05 $VERSION_NAME" \
            --notes-file release-notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sa05-${{ inputs.version_name }}-release-apk
          path: release/*.apk
          if-no-files-found: error
